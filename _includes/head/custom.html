<!-- Theme: dark ("midnight") by default, light ("mist") once a visitor picks it with the
     masthead switch (remembered in localStorage). ?theme=light / ?theme=dark previews one
     without saving. Runs before first paint, so there is no flash of the other theme. -->
<script>
  (function () {
    var theme = null;
    var forced = /[?&]theme=(light|dark)\b/.exec(location.search);
    try { theme = forced ? forced[1] : localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute('data-bg', theme === 'light' ? 'mist' : 'midnight');
  })();
</script>
<!-- Dot-matrix background (canvas) and the light / dark switch -->
<script src="{{ base_path }}/assets/js/dotgrid.js" defer></script>
<script src="{{ base_path }}/assets/js/theme.js" defer></script>
